# Workspace root for the Relay Python SDK. It is not published; it exists so that `uv sync` builds
# one environment holding both packages and the development tools, mirroring the pnpm workspace
# under ts/. Run `uv lock` after changing any dependency and commit uv.lock.
[project]
name = "relay-sdks-python"
version = "0.0.0"
description = "Development workspace for the Relay Python SDK"
requires-python = ">=3.11"
dependencies = ["moq-core", "mux-relay"]

[dependency-groups]
dev = ["import-linter>=2.0", "pytest>=8.0", "ruff>=0.13"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
moq-core = { workspace = true }
mux-relay = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["packages/moq-core/tests", "packages/mux-relay/tests"]

# The Python counterpart of ts/scripts/check-boundaries.mjs: the generic core must not know about Relay.
[tool.importlinter]
root_packages = ["moq_core", "mux_relay"]

[[tool.importlinter.contracts]]
name = "moq_core is protocol-only and imports nothing from mux_relay"
type = "forbidden"
source_modules = ["moq_core"]
forbidden_modules = ["mux_relay"]
