[project]
name = "moq-core"
version = "0.0.0"
description = "Transport-independent MOQT track primitives"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Boundary: the generic core has no runtime dependencies. A transport belongs in mux-relay,
# behind the abstract interface declared in moq_core.transport, matching the TypeScript
# `createTransport` seam.
dependencies = []

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
