[project]
name = "caprid-moq-media"
version = "0.3.0"
description = "Transport-independent LOC and MSF media format helpers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
# Released in lockstep with caprid-moq-core, so the pin is exact; scripts/release_version.py moves it.
dependencies = ["caprid-moq-core==0.3.0"]

[project.optional-dependencies]
# moq_media.opus, the Opus encoder and decoder. Nothing else in the package imports PyAV.
opus = ["av>=15"]

[project.urls]
Repository = "https://github.com/caprids/relay-sdks"

[tool.uv.sources]
caprid-moq-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# The distribution is caprid-moq-media; the import name stays moq_media.
[tool.uv.build-backend]
module-name = "moq_media"
