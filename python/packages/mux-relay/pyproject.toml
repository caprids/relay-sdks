[project]
name = "mux-relay"
version = "0.0.0"
description = "Relay Python SDK"
readme = "README.md"
requires-python = ">=3.11"
# The product package owns the Relay API, the authentication convention, and the default
# transport: WebTransport over HTTP/3 through aioquic, so this SDK runs natively with no browser.
dependencies = ["moq-core", "aioquic>=1.3,<1.4"]

[tool.uv.sources]
moq-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
