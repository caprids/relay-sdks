# Tool versions and task entry points for every Relay SDK in this repository.
#
# Each language keeps its native tooling (pnpm under ts/, uv under python/). These tasks only fan
# out to it, so `cd ts && pnpm ...` and `cd python && uv ...` keep working under `mise exec`.
# Run `mise install` once, then `mise run check` or a per-language task such as `mise run ts:test`.

[tools]
node = "24.14.0"
pnpm = "11.17.0"
python = "3.13.15"
uv = "0.12.12"

[env]
# uv uses the interpreter pinned above instead of downloading a second one.
UV_PYTHON_DOWNLOADS = "never"

[tasks.install]
description = "Install every SDK's dependencies from its lockfile"
depends = ["ts:install", "python:install"]

[tasks.check]
description = "Run every SDK's full check"
depends = ["ts:check", "python:check"]

[tasks."ts:install"]
description = "Install TypeScript dependencies from pnpm-lock.yaml"
dir = "ts"
run = "pnpm install --frozen-lockfile"

[tasks."ts:build"]
description = "Build @mux/moq-core, @mux/moq-media, the optional Mediabunny adapter, and @mux/relay"
dir = "ts"
run = "pnpm build"

[tasks."ts:test"]
description = "Run the TypeScript unit and integration tests"
dir = "ts"
run = "pnpm test"

[tasks."ts:lint"]
description = "Format-check and lint the TypeScript SDK with Biome"
dir = "ts"
run = "pnpm lint"

[tasks."ts:fix"]
description = "Apply Biome's safe formatting and lint fixes to the TypeScript SDK"
dir = "ts"
run = "pnpm fix"

[tasks."ts:check"]
description = "Lint, build, typecheck, test, boundary-check, and API-reference-check the TypeScript SDK"
depends = ["ts:install"]
dir = "ts"
run = "pnpm check"

[tasks."ts:docs"]
description = "Generate the TypeScript API reference with TypeDoc into ts/docs-api/"
depends = ["ts:install"]
dir = "ts"
run = "pnpm run docs"

[tasks."ts:test:relay"]
description = "Opt-in live smoke test against a real Relay, in Node and in Chromium (RELAY_TOKEN or hidden prompt)"
depends = ["ts:install"]
tools = { rust = { version = "1.97.1", components = "rustfmt,clippy" } }
dir = "ts"
run = "pnpm test:relay"

[tasks."ts:test:conformance"]
description = "Run the transport adapter conformance suite in headless Chromium against the Python accepting end"
depends = ["ts:install", "python:install"]
dir = "ts"
run = "pnpm test:conformance"

# Only @mux/relay-quic's native addon needs Rust, so the tasks that build or lint it (these two, the live smoke test
# and the mux-global example) bring their own toolchain and nothing else installs one: `pnpm check` builds no Rust.
[tasks."ts:test:conformance:node"]
description = "Build @mux/relay-quic's addon and run the transport adapter conformance suite against it in Node"
depends = ["ts:install", "python:install"]
tools = { rust = { version = "1.97.1", components = "rustfmt,clippy" } }
dir = "ts"
run = "pnpm test:conformance:node"

[tasks."ts:check:native"]
description = "Format-check, lint and unit-test @mux/relay-quic's Rust crate"
tools = { rust = { version = "1.97.1", components = "rustfmt,clippy" } }
dir = "ts/packages/relay-quic/native"
run = ["cargo fmt --check", "cargo clippy --release --all-targets -- -D warnings", "cargo test --release"]

[tasks."ts:example:mux-global"]
description = "Run the mux.global example in Node; pass its options after --"
depends = ["ts:install"]
tools = { rust = { version = "1.97.1", components = "rustfmt,clippy" } }
dir = "ts"
run = "pnpm example:mux-global"

[tasks."python:install"]
description = "Create the Python workspace environment from uv.lock"
dir = "python"
run = "uv sync --locked"

[tasks."python:test"]
description = "Run the Python tests"
dir = "python"
run = "uv run pytest"

[tasks."python:check"]
description = "Lint, format-check, import-boundary-check, type-check, docstring-check, and test the Python SDK"
dir = "python"
run = [
  "uv sync --locked",
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run lint-imports",
  "uv run ty check",
  "uv run python scripts/check_docstrings.py",
  "uv run pytest",
]

[tasks."python:docs"]
description = "Render the Python API reference with pdoc to python/api-docs/ (open index.html)"
dir = "python"
run = "uv run pdoc --docformat restructuredtext --output-directory api-docs mux_relay mux_relay.webtransport moq_core moq_media"

[tasks."python:test:relay"]
description = "Opt-in live smoke test against a real Relay (RELAY_TOKEN or hidden prompt)"
dir = "python"
run = "uv run python scripts/test_relay.py"

[tasks."python:example:mux-global"]
description = "Run the mux.global example natively over aioquic; pass its options after --"
dir = "python"
run = "uv run python examples/mux_global/demo.py"

[tasks."python:example:videojs"]
description = "Stream H.264 (and optional Opus) to a namespace for a Video.js MoQ player; pass options after --"
dir = "python"
run = "uv run python examples/videojs_stream/stream.py"
