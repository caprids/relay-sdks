name: TypeScript SDK

on:
  push:
    branches: [main]
    paths:
      - 'ts/**'
      - 'spec/**'
      - 'mise.toml'
      - '.github/workflows/ts.yml'
      # The conformance job's accepting end and the aioquic stack under it.
      - 'python/packages/caprid-relay/tests/relay_helpers/**'
      - 'python/packages/caprid-relay/src/caprid_relay/quic/**'
      - 'python/uv.lock'
  pull_request:
    paths:
      - 'ts/**'
      - 'spec/**'
      - 'mise.toml'
      - '.github/workflows/ts.yml'
      - 'python/packages/caprid-relay/tests/relay_helpers/**'
      - 'python/packages/caprid-relay/src/caprid_relay/quic/**'
      - 'python/uv.lock'

concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm
      - run: mise run ts:check
      - run: mise run ts:docs
      - uses: actions/upload-artifact@v4
        with:
          name: ts-api-reference
          path: ts/docs-api/
          if-no-files-found: error

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm python uv
      - run: mise run ts:install
      - run: mise run python:install
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ts
      - run: mise run ts:test:conformance

  # The WebSocket transport adapter (@caprid/relay-websocket): in Node, then in Chromium, Firefox and WebKit. Its accepting
  # end is Node's, so it needs no Python.
  conformance-websocket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm
      - run: mise run ts:install
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        working-directory: ts
      - run: mise run ts:test:conformance:websocket
      - run: mise run ts:test:conformance:websocket:browsers

  # The Node transport adapter (@caprid/relay-quic). Its Rust is linted and built only here: the mise tasks below bring the
  # Rust toolchain they pin, and `check` builds no Rust.
  conformance-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm python uv
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ts/packages/relay-quic/native -> target
      - run: mise run ts:check:native
      - run: mise run ts:install
      - run: mise run python:install
      - run: mise run ts:test:conformance:node
      - name: The addon typings match the Rust
        run: git diff --exit-code -- ts/packages/relay-quic/src/native.d.ts
