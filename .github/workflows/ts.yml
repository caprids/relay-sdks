name: TypeScript SDK

on:
  push:
    branches: [main]
    paths:
      - 'ts/**'
      - 'spec/**'
      - 'mise.toml'
      - '.github/workflows/ts.yml'
      # The conformance job's accepting end and the aioquic stack under it.
      - 'python/packages/caprid-relay/tests/relay_helpers/**'
      - 'python/packages/caprid-relay/src/caprid_relay/quic/**'
      - 'python/uv.lock'
  pull_request:
    paths:
      - 'ts/**'
      - 'spec/**'
      - 'mise.toml'
      - '.github/workflows/ts.yml'
      - 'python/packages/caprid-relay/tests/relay_helpers/**'
      - 'python/packages/caprid-relay/src/caprid_relay/quic/**'
      - 'python/uv.lock'

concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm
      - run: mise run ts:check
      - run: mise run ts:docs
      - uses: actions/upload-artifact@v4
        with:
          name: ts-api-reference
          path: ts/docs-api/
          if-no-files-found: error

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm python uv
      - run: mise run ts:install
      - run: mise run python:install
      # Playwright's browsers are cached per runner image and Playwright version (ts/pnpm-lock.yaml pins it). No
      # --with-deps: the libraries Chromium needs ship on the runner image, so this job skips the apt-get download that
      # can crawl (see conformance-websocket).
      - name: Playwright version and runner image, for the cache key
        id: pw
        working-directory: ts
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright's browsers
        id: browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.pw.outputs.image }}-playwright-${{ steps.pw.outputs.version }}-chromium
      - name: Download Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
        working-directory: ts
      - run: mise run ts:test:conformance

  # The WebSocket transport adapter (@caprid/relay-websocket): in Node, then in Chromium, Firefox and WebKit. Its accepting
  # end is Node's, so it needs no Python.
  conformance-websocket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm
      - run: mise run ts:install
      # Playwright's browsers are cached as in `conformance`. Firefox and WebKit also need system libraries the runner
      # image lacks (about 130 MB of fonts, GStreamer and codec packages), which apt-get downloads from the runner's
      # Ubuntu mirror. That mirror sometimes crawls at tens of kB/s (once 49 minutes for one job), so the downloaded
      # .debs are cached too, under a key that rolls with the runner image (restore-keys reuses the last image's .debs,
      # and apt-get downloads only what changed). The apt-get index update still runs every time; it takes seconds.
      # Each install gets a time limit and one retry, which keeps what the first try downloaded.
      - name: Playwright version and runner image, for the cache keys
        id: pw
        working-directory: ts
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "image-version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright's browsers
        id: browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.pw.outputs.image }}-playwright-${{ steps.pw.outputs.version }}-chromium-firefox-webkit
      - name: Download Chromium, Firefox and WebKit
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium firefox webkit
        working-directory: ts
      - name: Restore the browsers' system packages (.debs)
        uses: actions/cache@v5
        with:
          path: ~/apt-archives
          key: ${{ runner.os }}-${{ steps.pw.outputs.image }}-apt-playwright-${{ steps.pw.outputs.version }}-chromium-firefox-webkit-${{ steps.pw.outputs.image-version }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.pw.outputs.image }}-apt-playwright-${{ steps.pw.outputs.version }}-chromium-firefox-webkit-
      - name: Install the browsers' system libraries
        id: deps
        continue-on-error: true
        timeout-minutes: 10
        working-directory: ts
        run: |
          printf 'APT::Keep-Downloaded-Packages "true";\nDPkg::Lock::Timeout "120";\n' |
            sudo tee /etc/apt/apt.conf.d/99-ci-playwright > /dev/null
          if compgen -G "$HOME/apt-archives/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-archives/*.deb /var/cache/apt/archives/
          fi
          pnpm exec playwright install-deps chromium firefox webkit
      - name: Install the browsers' system libraries (second try)
        if: steps.deps.outcome == 'failure'
        timeout-minutes: 15
        working-directory: ts
        run: |
          # The first try may have left root's apt-get downloading, or dpkg unpacking. Stop the download (what it has
          # fetched stays in /var/cache/apt/archives), let dpkg finish, then repair any half-configured package.
          sudo pkill -x apt-get || true
          timeout 300 bash -c 'while pgrep -x apt-get > /dev/null || pgrep -x dpkg > /dev/null; do sleep 2; done'
          sudo dpkg --configure -a
          pnpm exec playwright install-deps chromium firefox webkit
      - name: Keep the downloaded .debs for the cache
        run: |
          sudo apt-get autoclean
          rm -rf ~/apt-archives
          mkdir -p ~/apt-archives
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-archives {} +
      - run: mise run ts:test:conformance:websocket
      - run: mise run ts:test:conformance:websocket:browsers

  # The Node transport adapter (@caprid/relay-quic). Its Rust is linted and built only here: the mise tasks below bring the
  # Rust toolchain they pin, and `check` builds no Rust.
  conformance-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm python uv
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ts/packages/relay-quic/native -> target
      - run: mise run ts:check:native
      - run: mise run ts:install
      - run: mise run python:install
      - run: mise run ts:test:conformance:node
      - name: The addon typings match the Rust
        run: git diff --exit-code -- ts/packages/relay-quic/src/native.d.ts
